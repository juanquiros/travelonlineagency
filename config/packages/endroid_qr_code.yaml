endroid_qr_code:
    default:
        writer: Endroid\QrCode\Writer\PngWriter
        size: 300
        margin: 10
        encoding: 'UTF-8'
        error_correction_level: 'low'
        round_block_size_mode: 'margin'
        validate_result: false
    custom:
        writer: Endroid\QrCode\Writer\PngWriter
        size: 50
        margin: 5
        encoding: 'UTF-8'
        error_correction_level: 'low'
        round_block_size_mode: 'margin'
        validate_result: false
    transfer_tracking:
        writer: Endroid\QrCode\Writer\PngWriter
        size: 200
        margin: 5
        encoding: 'UTF-8'
        error_correction_level: 'medium'
        round_block_size_mode: 'margin'
        validate_result: false
    share_card:
        writer: Endroid\QrCode\Writer\PngWriter
        size: 260
        margin: 5
        encoding: 'UTF-8'
        error_correction_level: 'high'
        round_block_size_mode: 'margin'
        validate_result: false
