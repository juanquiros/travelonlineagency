knp_snappy:
    pdf:
        enabled:    true
        binary:     '@=service("App\\Services\\SnappyBinaryResolver").getPdfBinary()'
        options:
            - { name: 'viewport-size', value: '1024x768' }
            - { name: 'page-size', value: 'A4'}
    image:
        enabled:    true
        binary:     '@=service("App\\Services\\SnappyBinaryResolver").getImageBinary()'
        options:    []
