# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    driver: "gd"
    twig:
        mode: lazy
    filter_sets:
        destino_card:
            quality: 80
            filters:
                thumbnail:
                    size: [480, 320]
                    mode: inset
                    allow_upscale: false
        destino_cover_preview:
            quality: 85
            filters:
                thumbnail:
                    size: [960, 640]
                    mode: inset
                    allow_upscale: false
